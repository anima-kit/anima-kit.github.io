## Site
site_name: AnimaKit AI
repo_name: "anima-kit/anima-kit.github.io"
repo_url: https://github.com/anima-kit/anima-kit.github.io
site_url: https://anima-kit.github.io/
site_description: AnimaKit AI | Learning AI, building demos, sharing results
site_author: Lauren Street
copyright: Copyright &copy; 2025 <a href="https://github.com/anima-kit">AnimaKit AI</a>

## Theme
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/lxlgs/logo-3.png
  favicon: assets/lxlgs/logo-3.png
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.prune
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.expand
    - navigation.path
    - content.tooltips
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    #- toc.integrate
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/brightness-7
        name: Light mode

    # Light Mode
    - scheme: default
      toggle:
        icon: material/brightness-3
        name: Dark mode    

## Markdown
markdown_extensions:
- abbr
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- tables
- toc:
    title: On this page
    permalink: ⚓︎
    permalink_title: Anchor link to this section for reference
    toc_depth: 4
    slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
- pymdownx.blocks.caption
- pymdownx.details
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.inlinehilite
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.snippets:
    auto_append:
      - includes/abbreviations.md
- pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true 
- pymdownx.critic
- pymdownx.caret
- pymdownx.keys
- pymdownx.mark
- pymdownx.tilde
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.arithmatex:
    generic: true
- material.extensions.preview:
    configurations:
      - targets:
          include:
            - projects/*
            - tutorials/index.md
            - tutorials/applications/index.md
            - tutorials/applications/agents/index.md
            - tutorials/applications/agents/servers/index.md
            - tutorials/applications/agents/agents/index.md
            - tutorials/applications/mcp/index.md
            - tutorials/applications/rag/index.md
            - tutorials/applications/web-apps/index.md
            - tutorials/fundamentals/index.md
            - tutorials/research/index.md
            - blog/*


