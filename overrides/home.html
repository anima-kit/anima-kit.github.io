{% extends "main-styles.html" %}

<!-- Render hero under tabs -->
{% block tabs %}
{{ super() }}

<!-- 1st section -->
<!-- Create sparkle container for sparkle animations and use landing animation -->
<!-- Main landing image and button to tutorials landing -->
<section class="landing-animation">
  <div class="flex-row sparkle-container" style="position: relative; padding: 0px; margin: 0px; height: 100vh;">

    <!-- Text container -->
    <!-- Background or no? Not sure which one I like more yet... -->
    <div class="flex-col title-flex" style="background-color: var(--color-pink-primary--transparent); padding: 1vw; border-radius: 1vw;">
    <!--<div class="flex-col title-flex">-->
      <p class="main-title" style="padding: 0vw; margin: 0vw; color: var(--color-pink-lightest);"> Welcome to anima-kit! </p>
      <p class="main-subtitle" style="padding: 0vw; margin:0vw; color: var(--color-pink-lightest);"> Tutorials for building AI agents </p>
    </div>
    
    <!-- Button container -->
    <div class="flex-col btn-flex">
      <a href="./tutorials/" title="Tutorials" class="btn-main glimmer-effect">
        <p> Get Started </p>
      </a>
    </div>
    
    <!-- Image container -->
    <div class="flex-col" style="order:0; flex: 100%; overflow:hidden; padding: 0px; margin: 0px; height: 100%;">
      <img src="assets/lxlgs/logo-0.png" style="width: 100%; height: 100%; object-fit: cover;" />
    </div>
  </div>
</section>


<section class="body-background-0">
<!-- 2nd section -->
<!-- Create cycling-text to use animated-text to cycle through text items -->
<!-- Use btn-blue to link to tutorials landing  -->
  <div class="full-screen">
    <div class="img-wrapper">
      <img src="assets/lxlgs/logo-1.png" alt="logo">
    </div>
    <div class="animated-text">
      <!-- TODO: Do we want to keep the static text or just leave it out? -->
      <!-- <span class="static-text">Learn how to</span> -->
      <a href="./tutorials/" title="Tutorials" class="btn-blue glimmer-effect flex-col cycle-text-btn" >
        <div>
            <span id="cycling-text" class="bordered-text"><i class="mdi mdi-server" style="color: var(--color-pink-primary)"></i> Build tool servers</span>
        </div>
      </a>
    </div>
  </div>
</section>


<!-- 3rd section -->
<div class="page-wrapper" style="position: relative; padding: 0px; margin: 0px; height: 100vh;">
<!-- Show a nice image -->
  <section class="body-background-2 background-image">
    <div class="flex-col" style="order:0; flex: 100%; overflow:hidden; padding: 0px; margin: 0px; height: 100%;">
      <img src="assets/lxlgs/logo-2.png" style="width: 100%; height: 100%; object-fit: cover;"/>
    </div>
  </section>


<!-- Footer -->
<!-- Use footer-item to link to github, about page, servers tutorials landing, and agents tutorials landing -->
  <footer class="body-background-2">
    <div class="footer-flex">
      <div class="flex-row footer-menu-flex">
        <div class="flex-col footer-menu-text">
          <ul>
            <li class="footer-item">
              <a href="https://github.com/anima-kit/" title="anima-kit">Home</a>
            </li>
            <li class="footer-item">
              <a href="./about/" title="About">About</a>
            </li>
          </ul>
        </div>
        <div class="flex-col footer-menu-text">
          <ul>
            <li class="footer-item">
              <a href="./tutorials/servers/" title="Servers">Servers</a>
            </li>
            <li class="footer-item">
              <a href="./tutorials/agents/" title="Agents">Agents</a>
            </li>
          </ul>
        </div>
      </div>

<!-- Use social-item to link to github, linkedin, medium, twitter -->
      <div class="footer-social-flex">
        <a href="https://github.com/anima-kit/">
          <img
            src="assets/icons/github.svg"
            title="Github"
            class="social-item"
          />
        </a>
        <a href="https://www.linkedin.com/in/lauren-street-62a747381/" class="blank">
          <img
            src="assets/icons/linkedIn.svg"
            title="LinkedIn"
            class="social-item"
          />
        </a>
        <a href="https://medium.com/@animakit/" class="blank">
          <img
            src="assets/icons/medium.svg"
            title="Medium"
            class="social-item"
          />
        </a>
        <a href="https://x.com/animakit/" class="blank">
          <img
            src="assets/icons/twitter.svg"
            title="Twitter"
            class="social-item"
          />
        </a>
      </div>
    </div>
  </footer>
</div>

{% endblock %}
