{% extends "main.html" %}

{% block tabs %}
{{ super() }}

<!-- vw = viewport width - sets elements based on screen width -->
<!-- vh = viewport height - sets elements based on screen height -->
<!-- rem = root element - sets elements based on font size of root element -->
<!-- px = pixel - either an absolute unit of length (1/96 of an inch) but more likely depends on device -->

<!-- LINKS -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<!-- Brings in icons from Google Fonts -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@6.x/css/materialdesignicons.min.css">
<!-- Material Design Icons -->

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<!-- Loads Roboto font -->


<!-- ANIMATIONS -->
<style>
    /* 
    Landing page fade in and slide up
    */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .landing-animation {
        animation: fadeIn 1.2s ease-out forwards;
        height: 100vh;
        min-height: 100vh;
    }

    /* 
    Sparkling effect animation - used to give appearance of ice crystals
    */
    @keyframes sparkle {
        0%   { transform: scale(1); opacity: 0.5; }
        20%  { transform: scale(1.25) rotateX(10deg) rotateY(36deg); opacity: 0.4; }
        40%  { transform: scale(1.1); opacity: 0.2; }
        60%  { transform: scale(1.5) rotateZ(-25deg) rotateY(-36deg); opacity: 0.2; }
        80%  { transform: scale(1.25) rotateZ(-25deg) rotateY(0deg); opacity: 0.4; }
        100% { transform: scale(1) rotateX(0deg) rotateY(0deg); opacity: 0.5; }
    }

    .glass-membrane {
      background: var(--color-blue-lightest-least-transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--color-blue-lightest-less-transparent);
      box-shadow: 0 4px 20px var(--color-primary--transparent);
      overflow: hidden; /* Prevents gradient from overflowing */
    }

    .sparkle {
        position: absolute;
        color: var(--color-blue-lightest);
        opacity: 0;                                 /* Start invisible */
        animation: sparkle 10s infinite ease-in-out;
        pointer-events: none;                       /* Don't interfere with interactions */
        width: 25rem;
    }

    .sparkle-container {
      width: 50%;
      align-items: center; 
      justify-content: center;
    }

    .sparkle-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200vw;
      height: 200vh;
      background: linear-gradient(45deg, 
        transparent 45%, 
        var(--color-blue-lightest--less-transparent) 50%, 
        transparent 55%);
      transform: rotate(30deg);
      z-index: -1;
      animation: shine 5s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) rotate(30deg); }
      100% { transform: translateX(100%) rotate(30deg); }
    }

    /* 
    Glowing pulse effect animation - used to give apearance of soft, pulsing shimmer
    */
    @keyframes glow {
        0% {
            box-shadow: 0 0 4px var(--color-blue-lightest), 0 0 6px var(--color-blue-lighter), 0 0 8px var(--color-blue-light);
        }
        50% {
            box-shadow: 0 0 5px var(--color-blue-lightest), 0 0 56px var(--color-blue-lighter), 0 0 8px var(--color-blue-light);
        }
        100% {
            box-shadow: 0 0 4px var(--color-blue-lightest), 0 0 6px var(--color-blue-lighter), 0 0 8px var(--color-blue-light);
        }
    }
    .glimmer-effect {
        animation: glow 5s ease-in-out infinite alternate;
    }
</style>

<script>
  // Function to create sparkles
  function createSparkles() {
    const container = document.querySelector('.sparkle-container');
    if (!container) {
      console.warn('Sparkle container not found');
      return;
    }
    const spark = document.createElement('span');
    spark.className = 'sparkle';
    const svgCode = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <title>dna</title>
        <defs>
        <!-- glassy / shining gradient -->
        <radialGradient id="shine"
                        cx="50%" cy="30%" r="70%"
                        fx="60%" fy="40%">
          <stop offset="0%"   stop-color="var(--color-blue-primary)" stop-opacity="1"/>
          <stop offset="45%"  stop-color="var(--color-blue-analog)" stop-opacity=".8"/>
          <stop offset="75%"  stop-color="var(--color-blue-primary)" stop-opacity=".3"/>
          <stop offset="100%" stop-color="var(--color-blue-light)" stop-opacity="0"/>
        </radialGradient>
      </defs>
        <path 
          d="M4,2H6V4C6,5.44 6.68,6.61 7.88,7.78C8.74,8.61 9.89,9.41 11.09,10.2L9.26,11.39C8.27,10.72 7.31,10 6.5,9.21C5.07,7.82 4,6.1 4,4V2M18,2H20V4C20,6.1 18.93,7.82 17.5,9.21C16.09,10.59 14.29,11.73 12.54,12.84C10.79,13.96 9.09,15.05 7.88,16.22C6.68,17.39 6,18.56 6,20V22H4V20C4,17.9 5.07,16.18 6.5,14.79C7.91,13.41 9.71,12.27 11.46,11.16C13.21,10.04 14.91,8.95 16.12,7.78C17.32,6.61 18,5.44 18,4V2M14.74,12.61C15.73,13.28 16.69,14 17.5,14.79C18.93,16.18 20,17.9 20,20V22H18V20C18,18.56 17.32,17.39 16.12,16.22C15.26,15.39 14.11,14.59 12.91,13.8L14.74,12.61M7,3H17V4L16.94,4.5H7.06L7,4V3M7.68,6H16.32C16.08,6.34 15.8,6.69 15.42,7.06L14.91,7.5H9.07L8.58,7.06C8.2,6.69 7.92,6.34 7.68,6M9.09,16.5H14.93L15.42,16.94C15.8,17.31 16.08,17.66 16.32,18H7.68C7.92,17.66 8.2,17.31 8.58,16.94L9.09,16.5M7.06,19.5H16.94L17,20V21H7V20L7.06,19.5Z" 
          fill="url(#shine)" 
        />
      </svg>
    `;
    spark.innerHTML = svgCode; 
    container.appendChild(spark);
  }
  
  // Initialize sparkles when DOM is loaded
  document.addEventListener("DOMContentLoaded", () => {
    console.log('DOM loaded - creating initial sparkles');
    createSparkles();
  });
</script>


<!-- BACKGROUNDS -->
<style>
    .body-background-1 {
        background: linear-gradient(
          0deg, 
          var(--color-pink-primary) 0%, 
          var(--color-blue-light) 30%,

        );

    }

    .body-background-2 {

        flex: 1;
        display: flex;

<!-- BUTTONS -->
<style>
    /* 
    Main button with blue gradient
    */
    .btn-main {
        color: var(--color-blue-darkest);
        background: var(--color-blue-primary);
        border: solid var(--color-blue-lightest) 0.3rem;
        box-shadow: rgb(0, 0, 0) 0px 0px 0px 0px;
        transition: all 0.3s ease;
        transform: translateY(0);
        display: flex;          /* Makes layout flexible */
        flex-direction: column; /* Stacks content vertically */
        align-items: center;    /* Centers content horizontally */
        justify-content: center;
        cursor: pointer;        /* Shows hand cursor when hovering over button */
        border-radius: 1rem;
        width: 12rem;  
        font-weight:bold;
        height: 6rem;
        font-size: 2rem;
        padding: 2rem;
        text-align: center;
        margin-top: 3rem;
    }
    .btn-main:hover {
        transform: scale(1.1);
        background: var(--color-blue-light--least-transparent);
        color: var(--color-pink-darkest);
    }
</style>


<!-- CONTAINERS -->
<style>
  /* 
  Flex container for horizontal arrangements
  */
  .flex-row {
      display: flex;
      flex-flow: row;
  }
  
  /* 
  Flex container for vertical arrangements
  */
  .flex-col {
      display: flex;
      flex-flow: column;
  }

  .title-flex {
    padding: 2rem;
    width: 50%;
    align-items: center; 
    justify-content: center;
    background-image: url('./assets/lxlgs/logo-6.png');
    background-color: var(--color-pink-primary--transparent);
    background-repeat: repeat-x;
    background-size: auto 100%;
    animation: slideBackAndForth 10s ease-in-out infinite;
    animation-direction: alternate;
    position: relative;
    overflow: hidden;
  }

  @keyframes slideBackAndForth {
    0% {
      background-position: 0 0;
    }
    100% {
      background-position: 100% -100%;
    }
  }

  .title-flex-2 {
    padding: 2rem;
    width: 70%;
    align-items: center; 
    justify-content: center;
  }

  .page-wrapper{
      display:flex;
      flex-direction:column;
      min-height:100vh; 
      height: 100vh;
  }

  footer{
      margin-top:auto;  /* stays on bottom */
  }

  .footer-menu-flex {
    display: flex;
    margin-left: 2rem; 
    gap: 4rem;
    flex: 100%;
    flex-direction:row;
  }
  .footer-menu-text {
    font-size: 2rem; 
    color: var(--color-blue-lightest);
  }
  .footer-social-flex {
    display: flex;
    margin-left: 2rem; 
    margin-top: 1rem;
    justify-content:center;   /* center icons */
    align-items: center;    /* vertical centering (optional) */
    gap: 0;
    flex: 100%;
  }
</style>


<!-- FONT -->
<style>
    /* 
    Default font for entire page
    */
    body {
        font-family: 'Roboto', sans-serif; /* Fallback to sans-serif */
    }
</style>

<!-- FOOTER -->
<style>
  .footer-flex {
    display: flex;
    flex-flow: row;
    align-items: center;
    justify-content: center;
  }

  .footer-social-flex {
    display: flex;
    justify-content: center;        /* horizontal centering of icons */
    align-items: center;            /* optional vertical centering */
    gap: .75rem;                    /* space between icons – tweak as needed */
    margin-left: auto;              /* no left offset */
    margin-right: auto;             /* no right offset */
  }

  .social-item {
      width: 4rem;   /* or whatever fits your design */
      height: auto;  /* keep aspect ratio */
  }
  /* Change colors during hover */
  .footer-item:hover {
      color: var(--color-blue-primary)
  }
  /* Change background color and sets round corners during hover */
  .social-item:hover {
      background-color: var(--color-blue-primary);
      border-radius: 10rem;
  }
  
  /* Hide default Material for MKDocs footer on this page */
  .md-footer {
      display: none;
  }
</style>


<!-- LISTS -->
<style>
  /* Remove default bullet points and padding from unordered lists */
  ul {
    list-style: none;
    padding-left: 0px;
  }
  
  /* Make default bullet points stars */

    content: "✧";
    color: var(--color-blue-primary);
    margin-right: 1rem;
  }
</style>


<!-- TEXTS -->

    font-weight: 550;
    text-align: center;
