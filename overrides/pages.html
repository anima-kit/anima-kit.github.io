<!-- See https://github.com/squidfunk/mkdocs-material/blob/master/material/overrides/main.html -->

{% extends "base.html" %}

{% block htmltitle %}

  <!-- Set title to page title | If none use site name -->
  {% if page.meta and page.meta.title %}
    <title>{{ page.meta.title }}</title>
  {% elif page.title and not page.is_homepage %}
    <title>{{ page.title | striptags }}</title>
  {% else %}
    <title>{{ config.site_name }}</title>
  {% endif %}
  
{% endblock %}
